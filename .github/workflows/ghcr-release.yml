name: GHCR Release

# Tag-triggered container image publish for this fork.
#
# Pushing a tag like `edengold/2.1.0` builds the bifrost-http gateway image
# from transports/Dockerfile.local (go workspace over the LOCAL module sources —
# NOT transports/Dockerfile, which compiles against the published maximhq/*
# modules and would silently ignore everything on this fork) and publishes
# ghcr.io/<owner>/<repo>:2.1.0 as a multi-arch (amd64 + arm64) manifest.
# A tag without a `-` in the version also updates `:latest`.
#
# The upstream release-pipeline mirrors to ghcr only as a best-effort
# continue-on-error step after a Docker Hub release; this workflow is the
# standalone, ghcr-only path for personal tags and has no Docker Hub
# dependency (no DOCKER_USERNAME/DOCKER_PASSWORD secrets needed).
#
# NOTE: GHCR creates a package PRIVATE on first push. For anonymous pulls flip
# visibility once: github.com/users/<owner>/packages/container/<repo>/settings
# → "Change visibility" → Public. The API cannot do this for container packages.
on:
  push:
    tags:
      - "edengold/*" # e.g. edengold/2.1.0 → image tag 2.1.0
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 2.1.0 (no `edengold/` prefix)"
        required: true

concurrency:
  group: ghcr-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # One place where the raw ref/input string is validated before it is
  # interpolated into any shell step below. ${{ }} expands textually before the
  # shell parses the line, so this mirrors the version-format guard the main
  # release pipeline enforces in detect-all-changes.sh: reject anything that is
  # not a plain MAJOR.MINOR.PATCH (with optional -prerelease / +build metadata).
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      stable: ${{ steps.parse.outputs.stable }}
      image: ${{ steps.parse.outputs.image }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Parse version from tag or input
        id: parse
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            # GITHUB_REF_NAME for a tag is the full ref name, e.g. edengold/2.1.0
            VERSION="${GITHUB_REF_NAME#edengold/}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-+][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::'$VERSION' is not a version — expected MAJOR.MINOR.PATCH with optional -prerelease or +build suffix"
            exit 1
          fi
          # Stable = no hyphen, same rule upstream's create-docker-manifest.sh uses
          # to decide whether :latest may move. Prereleases keep :latest pinned.
          STABLE=true
          if [[ "$VERSION" == *-* ]]; then
            STABLE=false
          fi
          # GHCR requires lowercase owner/repo.
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=$VERSION"
            echo "stable=$STABLE"
            echo "image=$IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $IMAGE:$VERSION (stable=$STABLE)"

  # Native per-arch builds, mirroring release-pipeline.yml's docker-build-*
  # jobs (ubuntu-24.04-arm for arm64 instead of QEMU — the UI stage runs vite
  # and the Go stage compiles CGO sqlite, both painful under emulation).
  build-amd64:
    needs: [meta]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          # Same host set as release-pipeline.yml's docker-build-amd64: alpine
          # apk + node/go module fetches inside the build, Docker Hub for the
          # pinned base images, ghcr + its storage backend for the push.
          allowed-endpoints: >
            auth.docker.io:443
            dl-cdn.alpinelinux.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            storage.googleapis.com:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 image
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: .
          file: ./transports/Dockerfile.local
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}-amd64

  build-arm64:
    needs: [meta]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            auth.docker.io:443
            dl-cdn.alpinelinux.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            storage.googleapis.com:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: .
          file: ./transports/Dockerfile.local
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}-arm64

  # Combine the two pushed per-arch manifests into a multi-arch index without
  # re-uploading layers (imagetools operates registry-side).
  manifest:
    needs: [meta, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            auth.docker.io:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443

      - name: Log in to GitHub Container Registry
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          VERSION: ${{ needs.meta.outputs.version }}
          STABLE: ${{ needs.meta.outputs.stable }}
        run: |
          set -euo pipefail
          TAGS=(--tag "${IMAGE}:${VERSION}")
          if [ "$STABLE" = "true" ]; then
            TAGS+=(--tag "${IMAGE}:latest")
          fi
          docker buildx imagetools create \
            "${TAGS[@]}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
